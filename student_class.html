<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Class4</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI;
    padding:40px;
}

.card{
    background:#1f2c4a;
    border-radius:20px;
    padding:25px;
    max-width:1000px;
    margin:auto;
}

button{
    background:#6f7cff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<button onclick="history.back()">
← Back
</button>

<div class="card">

<h1 id="classTitle">
Loading...
</h1>

<p id="classCode">
Loading...
</p>

</div>

<div style="text-align:center; margin-top:50px; margin-bottom:30px;">

<h2 style="color:white;">
🎯 CLASS MISSIONS
</h2>

<p style="color:#bfc9e0;">
Complete missions assigned in this class.
Your teacher will review each mission before unlocking the next one.
</p>

</div>
    
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const classId =
localStorage.getItem(
"currentClassId"
);

console.log("CLASS ID:", classId);

loadClass();

async function loadClass(){

const { data, error } =
await supabaseClient
.from("classes")
.select("*")
.eq("id", classId)
.single();

console.log("CLASS DATA:", data);
console.log("CLASS ERROR:", error);

if(error){

alert(error.message);

return;

}

document.getElementById(
"classTitle"
).innerHTML =
"📚 " + data.class_name;

document.getElementById(
"classCode"
).innerHTML =
"Class Code: " + data.class_code;

}    
    
</script>

</body>
</html>
