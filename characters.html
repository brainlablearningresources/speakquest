<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Hall2</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI;
    margin:0;
    padding:40px;
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:40px;
}

.card{
    background:#1f2c4a;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

.avatar{
    font-size:60px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    cursor:pointer;
}

.locked{
    opacity:0.5;
}

</style>
</head>

<body>

<h1>🚀 Mission Network</h1>

<div class="grid">

<div class="card">
<div class="avatar">🛰</div>
<h2>Arrival Hub</h2>

<p>
Status: Available
</p>

<p>
Activate your identity profile
and enter the network.
</p>

<a href="chat.html">
<button>Enter Mission</button>
</a>
</div>

<div class="card locked">
<div class="avatar">🛡️</div>
<h2>Orion</h2>
<p>Guardian Knight</p>

<button disabled>Locked</button>
</div>

<div class="card locked">
<div class="avatar">📚</div>
<h2>Elara</h2>
<p>Knowledge Sage</p>

<button disabled>Locked</button>
</div>

</div>

</body>
</html>
