<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class Details4</title>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#081633;
    color:white;
}

.header{
    text-align:center;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1f2c4a;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.code-box{
    background:#152445;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.student-box{
    background:#152445;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

button{
    background:#6f7cff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.back-btn{
    position:absolute;
    top:20px;
    left:20px;
}

</style>
</head>

<body>

<button
class="back-btn"
onclick="window.location.href='teacher_dashboard.html'"
>
← Back
</button>

<div class="header">

<h1>📚 Class Details</h1>

<p>
Manage students and class information
</p>

</div>

<div class="container">

<div class="card">

<h2 id="classTitle">
Loading...
</h2>

<div
id="classCode"
class="code-box"
>
Loading...
</div>

</div>

<div class="card">

<h2>Students</h2>

<div
id="studentList"
>
<div class="student-box">
No students enrolled yet
</div>
</div>

</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>    
    
<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
    
const params =
new URLSearchParams(
window.location.search
);

const classId =
params.get("id");

async function loadClass(){

const { data, error } =
await supabaseClient
.from("classes")
.select("*")
.eq("id", classId)
.single();

if(error){

console.log(error);

document.getElementById(
"classTitle"
).innerHTML =
"Class Not Found";

return;

}

document.getElementById(
"classTitle"
).innerHTML =
data.class_name;

document.getElementById(
"classCode"
).innerHTML =
"Class Code: <b>" +
data.class_code +
"</b>";

}

loadClass();
loadStudents();

async function loadStudents(){

console.log("LOAD STUDENTS STARTED");

}
    
</script>

</body>
</html>
