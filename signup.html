<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpeakQuest Sign Up9</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#1f2c4a;
    padding:40px;
    border-radius:20px;
    width:360px;
}

input, select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

h2{
    text-align:center;
}

</style>
</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input id="name" placeholder="Full Name">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<select id="role">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
</select>

<button onclick="signUp()">
Create Account
</button>

<p style="text-align:center; margin-top:15px;">
Already have an account?
<a href="login.html" style="color:#8db3ff;">
Login
</a>
</p>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function signUp(){

const full_name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const role =
document.getElementById("role").value;

const { data, error } =
await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
        data: {
            full_name: full_name,
            role: role
        },
        emailRedirectTo:
        "https://brainlablearningresources.github.io/speakquest/login.html"
    }
});

console.log("FULL AUTH DATA");
console.log(data);
console.log("AUTH ERROR:", error);

if(error){
alert(error.message);
return;
}

const user = data.user;

const profileResult =
await supabaseClient
.from("profiles")
.insert([
{
id: user.id,
email: email,
full_name: full_name,
role: role
}
]);

console.log("PROFILE RESULT:", profileResult);

if(profileResult.error){

    console.log("FULL ERROR:", profileResult.error);

    alert(
        profileResult.error.message +
        "\n\n" +
        JSON.stringify(profileResult.error)
    );

    return;
}

console.log("PROFILE RESULT:", profileResult);

if(profileResult.error){
alert(profileResult.error.message);
console.log(profileResult.error);
}

alert("Account created");
}

</script>

</body>
</html>
