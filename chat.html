<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna's Forest Test 6</title>

<style>
body{
    background:#101728;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    margin:0;
}

.header{
    background:#1f2c4a;
    padding:20px;
    text-align:center;
}

.chat-area{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.message{
    background:#1f2c4a;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    line-height:1.5;
}

.ai{
    border-left:5px solid #6f7cff;
}

.student{
    border-left:5px solid #3ddc97;
}

.input-area{
    text-align:center;
    padding:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="header">
    <h1>🌙 Luna's Forest</h1>
    <p>Practice speaking with Luna</p>
</div>

<div class="chat-area" id="chatArea">
    <div class="message ai">
        Hello adventurer! My name is Luna. What is your name?
    </div>
</div>

<div class="input-area">
    <button id="speakButton" onclick="startListening()">🎤 Start Speaking</button>
</div>

<script>

const chatArea = document.getElementById("chatArea");
const speakButton = document.getElementById("speakButton");

function addMessage(text, sender) {
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.textContent = text;
    chatArea.appendChild(message);
    message.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setButtonLoading(isLoading) {
    speakButton.disabled = isLoading;
    speakButton.textContent = isLoading ? "Listening..." : "🎤 Start Speaking";
}

async function askGemini(transcript) {

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzwC9t6wJe2GiG9hgnaesHee7VrKMKdyxB2m9C1uVKnEDgaJDEP2ItljdFiHpAGWb7tBA/exec";

const response = await fetch(
    APPS_SCRIPT_URL,
    {
        method: "POST",
        body: JSON.stringify({
            message: transcript
        })
    }
);

console.log("Response Status:", response.status);

const data = await response.json();

console.log("Response Data:", data);

if (!data.success) {
    throw new Error(
        data.error || "Unknown API error"
    );
}

return data.reply;

}

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    setButtonLoading(true);

    console.log("Speech recognition started.");

    recognition.start();

    recognition.onresult = async function(event) {
        const transcript = event.results[0][0].transcript.trim();

        console.log("Student transcript:", transcript);

        addMessage(transcript, "student");
        addMessage("Luna is thinking...", "ai");

        try {
            const lunaReply = await askGemini(transcript);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

            lastAiMessage.textContent = lunaReply;

            console.log("Luna reply:", lunaReply);
        } catch (error) {
            console.error("Gemini error:", error);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

            lastAiMessage.textContent =
                "Luna cannot answer right now. Please check the browser console for the Gemini error.";
        }
    };

    recognition.onerror = function(event) {
        console.error("Speech recognition error:", event.error);
        addMessage("Speech recognition error: " + event.error, "ai");
    };

    recognition.onend = function() {
        console.log("Speech recognition ended.");
        setButtonLoading(false);
    };
}
</script>

</body>
</html>
