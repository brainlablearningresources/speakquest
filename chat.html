<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna's Forest</title>

<style>
body{
    background:#101728;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    margin:0;
}

.header{
    background:#1f2c4a;
    padding:20px;
    text-align:center;
}

.chat-area{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.message{
    background:#1f2c4a;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    line-height:1.5;
}

.ai{
    border-left:5px solid #6f7cff;
}

.student{
    border-left:5px solid #3ddc97;
}

.input-area{
    text-align:center;
    padding:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="header">
    <h1>🌙 Luna's Forest</h1>
    <p>Practice speaking with Luna</p>
</div>

<div class="chat-area" id="chatArea">
    <div class="message ai">
        Hello adventurer! My name is Luna. What is your name?
    </div>
</div>

<div class="input-area">
    <button id="speakButton" onclick="startListening()">🎤 Start Speaking</button>
</div>

<script>
const API_KEY = "AQ.Ab8RN6Itj0tYuXnAKtgJcFXv5zCxq5bAZ6pgI2QrLRdIX_7Ueg";
const MODEL = "gemini-2.0-flash";

const chatArea = document.getElementById("chatArea");
const speakButton = document.getElementById("speakButton");

function addMessage(text, sender) {
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.textContent = text;
    chatArea.appendChild(message);
    message.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setButtonLoading(isLoading) {
    speakButton.disabled = isLoading;
    speakButton.textContent = isLoading ? "Listening..." : "🎤 Start Speaking";
}

async function askGemini(transcript) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;

    const requestBody = {
        system_instruction: {
            parts: [
                {
                    text: `
You are Luna, a friendly forest guide helping ESL learners practise English.

Rules:
- Speak naturally.
- Use simple English suitable for ESL learners.
- Be encouraging.
- Keep replies under 50 words.
- Ask follow-up questions when appropriate.
- Maintain a fantasy forest adventure atmosphere.
`
                }
            ]
        },
        contents: [
            {
                role: "user",
                parts: [
                    {
                        text: transcript
                    }
                ]
            }
        ],
        generationConfig: {
            temperature: 0.8,
            maxOutputTokens: 120
        }
    };

    console.log("Sending request to Gemini...");
    console.log("Model:", MODEL);
    console.log("Transcript:", transcript);
    console.log("Request body:", requestBody);

    const response = await fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify(requestBody)
    });

    const data = await response.json();

    console.log("Gemini status:", response.status);
    console.log("Gemini response:", data);

    if (!response.ok) {
        const errorMessage = data?.error?.message || "Unknown Gemini API error";
        throw new Error(errorMessage);
    }

    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;

    if (!reply) {
        throw new Error("Gemini returned no reply text.");
    }

    return reply.trim();
}

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    setButtonLoading(true);

    console.log("Speech recognition started.");

    recognition.start();

    recognition.onresult = async function(event) {
        const transcript = event.results[0][0].transcript.trim();

        console.log("Student transcript:", transcript);

        addMessage(transcript, "student");
        addMessage("Luna is thinking...", "ai");

        try {
            const lunaReply = await askGemini(transcript);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

            lastAiMessage.textContent = lunaReply;

            console.log("Luna reply:", lunaReply);
        } catch (error) {
            console.error("Gemini error:", error);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

            lastAiMessage.textContent =
                "Luna cannot answer right now. Please check the browser console for the Gemini error.";
        }
    };

    recognition.onerror = function(event) {
        console.error("Speech recognition error:", event.error);
        addMessage("Speech recognition error: " + event.error, "ai");
    };

    recognition.onend = function() {
        console.log("Speech recognition ended.");
        setButtonLoading(false);
    };
}
</script>

</body>
</html>
