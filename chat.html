<body>

<div class="header">
    <h1>🤖 Arrival Hub</h1>
    <p id="studentDisplay">
Network Orientation Terminal
</p>
</div>

<div class="chat-area" id="chatArea">
   <div class="message ai">
    Hello.

    My name is ARIA.

    Welcome to the Network.

    Before I grant access to additional sectors, I would like to learn a little about you.

    What is your name?
</div>
</div>

<div class="input-area">

    <button id="speakButton" onclick="startListening()">
        🎤 Start Speaking
    </button>

    <button onclick="completeMission()">
        📋 Complete Mission
    </button>

</div>

<script>
    
const chatArea = document.getElementById("chatArea");
const speakButton = document.getElementById("speakButton");

const conversationHistory = [];
conversationHistory.push({
    role: "assistant",
    text: "Hello. My name is ARIA. Welcome to the Network. Before I grant access to additional sectors, I would like to learn a little about you. What is your name?"
});
    
function addMessage(text, sender) {
    const message = document.createElement("div");
    message.className = "message " + sender;
    message.style.whiteSpace = "pre-wrap";
    message.textContent = text;
    chatArea.appendChild(message);
    message.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setButtonLoading(isLoading) {
    speakButton.disabled = isLoading;
    speakButton.textContent = isLoading ? "Listening..." : "🎤 Start Speaking";
}

async function askGemini(transcript) {

const API_URL =
"https://speakquestbackend.onrender.com/chat";

const response = await fetch(
    API_URL,
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
       body: JSON.stringify({
    message: transcript,
    history: conversationHistory
})
    }
);

console.log("Response Status:", response.status);

const data = await response.json();

console.log("Response Data:", data);

if (!data.success) {
    throw new Error(
        data.error || "Unknown API error"
    );
}

return data.reply;

}

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    setButtonLoading(true);

    console.log("Speech recognition started.");

    recognition.start();

    recognition.onresult = async function(event) {
       const transcript = event.results[0][0].transcript.trim();

conversationHistory.push({
    role: "user",
    text: transcript
});

console.log("Student transcript:", transcript);

        addMessage(transcript, "student");
        addMessage("ARIA is thinking...", "ai");

        try {
            const ariaReply = await askGemini(transcript);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

           lastAiMessage.textContent = ariaReply;

conversationHistory.push({
    role: "assistant",
    text: ariaReply
});

const speech = new SpeechSynthesisUtterance(
    ariaReply
);

speech.lang = "en-GB";

window.speechSynthesis.speak(speech);

console.log("ARIA reply:", ariaReply);
        } catch (error) {
            console.error("Gemini error:", error);

            const aiMessages = document.querySelectorAll(".message.ai");
            const lastAiMessage = aiMessages[aiMessages.length - 1];

            lastAiMessage.textContent =
                "ARIA is temporarily unavailable. Please try again in a few moments.";
        }
    };

    recognition.onerror = function(event) {
        console.error("Speech recognition error:", event.error);
        addMessage("Speech recognition error: " + event.error, "ai");
    };

    recognition.onend = function() {
        console.log("Speech recognition ended.");
        setButtonLoading(false);
    };
}

async function completeMission() {

    addMessage(
        "Generating assessment report...",
        "ai"
    );

   try {

const {
data: { session }
} =
await supabaseClient.auth.getSession();

const response = await fetch(
            "https://speakquestbackend.onrender.com/assess",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
               body: JSON.stringify({
    studentName: studentName,
    studentId: studentId,
    transcript: conversationHistory
})
            }
        );

        const data =
            await response.json();

        if(!data.success){
            throw new Error(data.error);
        }

        addMessage(
            data.report,
            "ai"
        );

    } catch(error){

        addMessage(
            "Assessment generation failed.",
            "ai"
        );

        console.error(error);
    }
}
    
</script>

</body>
</html>
