<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna's Forest TEST VERSION</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI;
    margin:0;
}

.header{
    background:#1f2c4a;
    padding:20px;
    text-align:center;
}

.chat-area{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.message{
    background:#1f2c4a;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.ai{
    border-left:5px solid #6f7cff;
}

.student{
    border-left:5px solid #3ddc97;
}

.input-area{
    text-align:center;
    padding:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>🌙 Luna's Forest</h1>

<p>
Practice speaking with Luna
</p>

</div>

<div class="chat-area">

<div class="message ai">
Hello adventurer! My name is Luna.
What is your name?
</div>

<div class="message student" id="studentText">
(Student response will appear here)
</div>

</div>

<div class="input-area">

<button onclick="startListening()">
🎤 Start Speaking
</button>

</div>
<script>

function startListening(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Speech recognition not supported in this browser.");
return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";

recognition.start();

recognition.onresult = async function(event){

const transcript =
event.results[0][0].transcript;

document.getElementById("studentText").innerHTML =
transcript;

const API_KEY = "AQ.Ab8RN6Itj0tYuXnAKtgJcFXv5zCxq5bAZ6pgI2QrLRdIX_7Ueg";

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,
{
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
contents: [
{
parts: [
{
text: `
You are Luna, a friendly forest guide.

Speak simply and naturally.

Keep responses under 50 words.

Student says:
${transcript}
`
}
]
}
]
})
}
);

const data = await response.json();

console.log(data);

if(data.candidates){

const lunaReply =
data.candidates[0].content.parts[0].text;

document.querySelector(".message.ai").innerHTML =
lunaReply;

}else{

document.querySelector(".message.ai").innerHTML =
"Gemini returned an error. Check console.";

console.log(data);

}
};

}

</script>
</body>

</html>
