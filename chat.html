<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna's Forest</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI;
    margin:0;
}

.header{
    background:#1f2c4a;
    padding:20px;
    text-align:center;
}

.chat-area{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.message{
    background:#1f2c4a;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.ai{
    border-left:5px solid #6f7cff;
}

.student{
    border-left:5px solid #3ddc97;
}

.input-area{
    text-align:center;
    padding:20px;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#6f7cff;
    color:white;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>🌙 Luna's Forest</h1>

<p>
Practice speaking with Luna
</p>

</div>

<div class="chat-area">

<div class="message ai">
Hello adventurer! My name is Luna.
What is your name?
</div>

<div class="message student">
(Student response will appear here)
</div>

</div>

<div class="input-area">

<button>
🎤 Start Speaking
</button>

</div>

</body>

</html>
