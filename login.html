<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpeakQuest Login6</title>

<style>

body{
    background:#101728;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.login-box{
    background:#1f2c4a;
    padding:40px;
    border-radius:20px;
    width:350px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:15px;
    background:#6f7cff;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

</style>
</head>

<body>

<div class="login-box">

<h2>SpeakQuest</h2>

<p>Enter the Network</p>

<input
    id="email"
    type="email"
    placeholder="Email"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<button
    onclick="googleLogin()"
    style="margin-top:10px;background:white;color:black;"
>
    Continue with Google
</button>

<p style="text-align:center;margin-top:15px;">
    Don't have an account?
    <a href="signup.html" style="color:#8db3ff;">
        Sign Up
    </a>
</p>    
    
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);    
    
async function login(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value.trim();

const { data, error } =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){
alert(error.message);
return;
}

const userId = data.user.id;

const { data: profile, error: profileError } =
await supabaseClient
.from("profiles")
.select("role")
.eq("id", userId)
.single();

if(profileError){
    alert(profileError.message);
    return;
}

if(profile.role === "teacher"){
    window.location.href = "teacher_dashboard.html";
}
else{
    window.location.href = "characters.html";
}

}

</script>

</body>
</html>
