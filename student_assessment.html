<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Assessment5</title>

<style>

body{
    margin:0;
    background:#081633;
    color:white;
    font-family:Segoe UI, Arial, sans-serif;
}

.header{
    text-align:center;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1f2c4a;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.back-btn{
    position:absolute;
    top:20px;
    left:20px;
    background:#6f7cff;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
}

.info-row{
    margin:12px 0;
    font-size:17px;
}

.label{
    color:#8fb3ff;
    font-weight:bold;
}

.content-box{
    margin-top:20px;
    background:#152445;
    border-radius:15px;
    padding:20px;
    white-space:pre-wrap;
    line-height:1.7;
}

</style>

</head>

<body>

<button
class="back-btn"
onclick="history.back()"
>
← Back
</button>

<div class="header">

<h1>
📝 Student Assessment
</h1>

<p>
Teacher Review Portal
</p>

</div>

<div class="container">

<div class="card">

<h2 id="studentName">
Loading...
</h2>

<div class="info-row">
<span class="label">Mission:</span>
<span id="mission">
Loading...
</span>
</div>

<div class="info-row">
<span class="label">Status:</span>
<span id="status">
Loading...
</span>
</div>

</div>

<div class="card">

<h2>
📝 Assessment Report
</h2>

<p style="color:#b8c8ff;">

Generated by SpeakQuest AI.

This report may be edited by the lecturer before approval.

</p>

<textarea
id="report"
class="content-box"
style="
width:100%;
min-height:700px;
resize:vertical;
overflow-y:auto;
border:none;
outline:none;
color:white;
font-family:Segoe UI, Arial, sans-serif;
font-size:16px;
box-sizing:border-box;
"
>

Loading report...

</textarea>

<br><br>

<button
onclick="saveReport()"
style="
background:#3ddc97;
padding:14px 28px;
font-size:16px;
"
>

💾 Save Assessment

</button>

</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const params =
new URLSearchParams(window.location.search);

const classId =
params.get("classId");

const studentId =
params.get("studentId");

let assessmentId = null;

loadAssessment();

async function loadAssessment(){

const { data, error } =
await supabaseClient
.from("student_assessments")
.select("*")
.eq("class_id", classId)
.eq("student_id", studentId)
.order("created_at",{ascending:false})
.limit(1)
.single();

if(error){

console.log(error);

return;

}

assessmentId = data.id;    

document.getElementById(
"studentName"
).textContent =
data.student_name;

document.getElementById(
"mission"
).textContent =
data.mission;

document.getElementById(
"status"
).textContent =
data.status;

document.getElementById(
"report"
).value =
data.ai_report;

}

async function saveReport(){

const editedReport =
document.getElementById(
"report"
).value;

const { error } =
await supabaseClient
.from("student_assessments")
.update({

ai_report: editedReport

})
.eq("id", assessmentId);

if(error){

console.log(error);

alert(
"Failed to save assessment."
);

return;

}

alert(
"✅ Assessment saved successfully."
);

}

</script>  
    
</body>
</html>
