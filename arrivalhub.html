<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arrival Hub4</title>

<style>

body{
    background:linear-gradient(180deg,#101728,#1d2942);
    color:white;
    font-family:Segoe UI;
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:900px;
}

.card{
    background:#1f2c4a;
    border-radius:25px;
    padding:50px;
    text-align:center;
}

.avatar{
    font-size:90px;
}

.mission-number{

    margin-top:25px;

    margin-bottom:10px;

    font-size:.85rem;

    letter-spacing:4px;

    font-weight:700;

    text-transform:uppercase;

    color:#8FA6D8;

}    

h1{

    margin-top:10px;

    margin-bottom:25px;

    font-size:2.4rem;

    letter-spacing:1px;

}

.story{

    font-size:1.1rem;

    line-height:1.9;

    color:#d6ddff;

    margin-top:30px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(111,124,255,.20);

    border-radius:18px;

    padding:28px;

    text-align:left;

}

.transmission{

    margin-top:0;

    margin-bottom:20px;

    font-size:.85rem;

    font-weight:700;

    letter-spacing:3px;

    text-transform:uppercase;

    color:#8FD7FF;

}    

button{
    margin-top:40px;
    padding:18px 40px;
    border:none;
    border-radius:15px;
    background:#6f7cff;
    color:white;
    font-size:1.1rem;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-4px);
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="avatar">🛰</div>

<p class="mission-number">

MISSION 001

</p>

<h1>

FIRST CONTACT

</h1>

<div class="story">

<p class="transmission">

🛰 INCOMING TRANSMISSION

</p>

<p>

Greetings, Agent.

</p>

<p>

Welcome to the <strong>Nova Network</strong>.

Your first assignment is to establish
communication with <strong>ARIAN</strong>,
your AI Mission Guide.

</p>

<p>

Complete your first conversation
to gain access to the next sector
and officially begin your journey.

</p>

</div>

<a href="chat.html">
<button>
Begin Mission
</button>
</a>

</div>

</div>

</body>
</html>
