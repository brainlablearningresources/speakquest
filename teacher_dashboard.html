<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard8</title>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#081633;
    color:white;
}

.header{
    padding:25px;
    text-align:center;
}

.header h1{
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1f2c4a;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    margin-bottom:15px;
}

button{
    background:#6f7cff;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.class-list{
    margin-top:20px;
}

.class-item{
    background:#152445;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
}

.logout{
    position:absolute;
    top:20px;
    left:20px;
}

</style>
</head>

<body>

<button class="logout">
Logout
</button>

<div class="header">

<h1>🎓 Teacher Control Center</h1>

<p>
Create classes and manage your students
</p>

</div>

<div class="container">

<div class="card">

<h2>Create New Class</h2>

<input
id="className"
placeholder="Example: ELD1134 Grammar II"
>

<button onclick="createClass()">
Create Class
</button>

</div>

<div class="card">

<h2>My Classes</h2>

<div
id="classList"
class="class-list"
>

</div>
</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function createClass(){

const className =
document.getElementById(
"className"
).value.trim();

if(!className){
    alert("Enter class name");
    return;
}

const {
data: { user }
} =
await supabaseClient.auth.getUser();
console.log("CURRENT USER:", user);

const classCode =
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

const result =
await supabaseClient
.from("classes")
.insert([
{
class_name: className,
class_code: classCode,
teacher_id: user.id
}
]);

if(result.error){

    console.log(
        "FULL ERROR:",
        result.error
    );

    alert(
        result.error.message
    );

    return;
}

alert("Class created");

loadClasses();

}

async function loadClasses(){

const {
data: { user }
} =
await supabaseClient.auth.getUser();

const { data, error } =
await supabaseClient
.from("classes")
.select("*")
.eq("teacher_id", user.id);

if(error){
    console.log(error);
    return;
}

const classList =
document.getElementById(
"classList"
);

classList.innerHTML = "";

data.forEach(cls => {

classList.innerHTML += `
<div class="class-item">
${cls.class_name}
<br><br>
Class Code:
<b>${cls.class_code}</b>
</div>
`;

});

}

loadClasses();

</script>    
    
</body>
</html>
