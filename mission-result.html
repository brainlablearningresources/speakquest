<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission Result4</title>

<style>

body{
margin:0;
background:#081633;
color:white;
font-family:Segoe UI,Arial,sans-serif;
}

.container{
max-width:900px;
margin:60px auto;
padding:20px;
}

.card{
background:#1f2c4a;
padding:40px;
border-radius:20px;
}

h1{
font-size:40px;
margin-bottom:10px;
}

.subtitle{
color:#b8c8ff;
margin-bottom:35px;
}

.feedback{

background:#152445;

padding:25px;

border-radius:15px;

margin-top:30px;

white-space:pre-wrap;

line-height:1.7;

}

button{

margin-top:35px;

background:#3ddc97;

color:white;

border:none;

padding:16px 30px;

border-radius:12px;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1 id="title">
Loading...
</h1>

<p
id="subtitle"
class="subtitle">
Loading...
</p>

<div
class="feedback">

<h2>
👨‍🏫 Teacher Feedback
</h2>

<p id="feedback">
Loading...
</p>

</div>

<button
id="actionButton">
Loading...
</button>

</div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ecacycipqjvfskfhgkyx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m7St5qWjV5e4xnfOYCx1MA_45N_IQHW";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function initialize(){

const {
data:{session}
} =
await supabaseClient.auth.getSession();

if(!session){

window.location.href =
"login.html";

return;

}

const studentId =
session.user.id;

await loadMissionResult(studentId);

}

initialize();

async function loadMissionResult(studentId){

const { data, error } =
await supabaseClient
.from("student_assessments")
.select("*")
.eq("student_id", studentId)
.order("created_at",{ascending:false})
.limit(1)
.single();

if(error){

console.log(error);

return;

}

if(data.final_result === "Waiting"){

document.getElementById(
"title"
).textContent =
"⏳ Waiting for Lecturer Review";

document.getElementById(
"subtitle"
).textContent =
"Your mission has been submitted successfully. Your lecturer has not reviewed it yet.";

document.getElementById(
"feedback"
).textContent =
"Your submission is currently awaiting review. Please check back later.";

document.getElementById(
"actionButton"
).textContent =
"Return to Home";

}

else if(data.final_result === "Approved"){

document.getElementById(
"title"
).textContent =
"🎉 Mission Approved";

document.getElementById(
"subtitle"
).textContent =
"Congratulations! Your lecturer has approved this mission.";

document.getElementById(
"feedback"
).textContent =
data.teacher_feedback ||
"No feedback provided.";

document.getElementById(
"actionButton"
).textContent =
"Continue to Next Mission";

}

else{

document.getElementById(
"title"
).textContent =
"🔄 Revision Required";

document.getElementById(
"subtitle"
).textContent =
"Your lecturer has requested revisions before you continue.";

document.getElementById(
"feedback"
).textContent =
data.teacher_feedback ||
"No feedback provided.";

document.getElementById(
"actionButton"
).textContent =
"Retry Mission";

}

const actionButton =
document.getElementById("actionButton");

if(data.final_result === "Waiting"){

actionButton.onclick = function(){

window.location.href =
"index.html";

};

}

else if(data.final_result === "Approved"){

actionButton.onclick = function(){

window.location.href =
"network-sector.html";

};

}

else{

actionButton.onclick = function(){

window.location.href =
"arrival-hub.html";

};

}
  
}

</script>
  
</body>

</html>
